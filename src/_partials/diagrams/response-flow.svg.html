<svg class="dg" viewBox="0 0 860 190" role="img" aria-label="An action enters a shared mechanism together with exogenous context. The mechanism selects a response, which is evaluated by an outer criterion. The action is assessed through the completed response, not through the context observed before action." xmlns="http://www.w3.org/2000/svg">
  <g class="dg-box" data-part="map">
    <rect x="18" y="65" width="166" height="88" rx="9"/>
    <text class="dg-title" x="101" y="96" text-anchor="middle">Action</text>
    <text class="dg-cap" x="101" y="120" text-anchor="middle">offer, target, or order</text>
    <text class="dg-cap" x="101" y="138" text-anchor="middle">u</text>
  </g>
  <g class="dg-box" data-part="opt">
    <rect x="254" y="65" width="216" height="88" rx="9"/>
    <text class="dg-title" x="362" y="96" text-anchor="middle">Shared mechanism</text>
    <text class="dg-cap" x="362" y="120" text-anchor="middle">clearing, coordination, or</text>
    <text class="dg-cap" x="362" y="138" text-anchor="middle">another agent’s optimization</text>
  </g>
  <g class="dg-box" data-part="recourse">
    <rect x="540" y="65" width="142" height="88" rx="9"/>
    <text class="dg-title" x="611" y="96" text-anchor="middle">Response</text>
    <text class="dg-cap" x="611" y="120" text-anchor="middle">allocation, path,</text>
    <text class="dg-cap" x="611" y="138" text-anchor="middle">price, or execution</text>
  </g>
  <g class="dg-box" data-part="evals">
    <rect x="744" y="65" width="98" height="88" rx="9"/>
    <text class="dg-title" x="793" y="96" text-anchor="middle">Evaluation</text>
    <text class="dg-cap" x="793" y="122" text-anchor="middle">outer</text>
    <text class="dg-cap" x="793" y="139" text-anchor="middle">criterion</text>
  </g>
  <g class="dg-box" data-part="info">
    <rect x="298" y="14" width="128" height="28" rx="14"/>
    <text class="dg-chip-t" x="362" y="33" text-anchor="middle">context</text>
  </g>
  <g class="dg-edge" data-part="map opt"><path class="dg-line" d="M184 109H241"/><path class="dg-head" d="M241 109l-8-4.3v8.6z"/></g>
  <g class="dg-edge" data-part="opt recourse"><path class="dg-line" d="M470 109H527"/><path class="dg-head" d="M527 109l-8-4.3v8.6z"/></g>
  <g class="dg-edge" data-part="recourse evals"><path class="dg-line" d="M682 109H731"/><path class="dg-head" d="M731 109l-8-4.3v8.6z"/></g>
  <g class="dg-edge dashed" data-part="info opt"><path class="dg-line" d="M362 42V55"/><path class="dg-head" d="M362 55l-4.3-8h8.6z"/></g>
  <text class="dg-elab" x="430" y="180" text-anchor="middle">The outer criterion reads the completed response, not a fixed pre-action forecast.</text>
</svg>
