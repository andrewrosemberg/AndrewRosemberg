  <title id="proxy-title">Value-only training of a selected optimization proxy</title>
  <desc id="proxy-desc">An offline constrained solve maps sampled contexts to selected solutions. During training, a neural proxy maps the same contexts to predicted decisions, and only prediction value error is minimized. No automatic differentiation or first-order label appears in the construction. At deployment the proxy maps a new context to a decision.</desc>
